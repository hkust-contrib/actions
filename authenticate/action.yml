name: Authenticate
description: Authenticate the GitHub Actions runner by exchanging its OIDC ID token for a workload identity federation token (RFC 8693) on Wayport
inputs:
  org:
    description: "ID of the organization on the identity provider that owns the workload identity. Each organization supplies its own"
    required: true
  endpoint:
    description: "Base URL of the identity provider performing the token exchange"
    required: false
    default: "https://login.ust.dev"
  id_token_audience:
    description: "Audience of the GitHub OIDC ID token. Must match one of the workload audiences configured on the provider; when omitted, the runner's default audience is requested"
    required: false
    default: ''
  scope:
    description: "Space-separated scopes to request, must be a subset of the workload identity's allowed scopes. Defaults to all allowed scopes"
    required: false
    default: ''
  audience:
    description: "Audience of the issued access token. Defaults to the workload identity's single allowed audience; required when the identity allows multiple audiences"
    required: false
    default: ''
outputs:
  access_token:
    description: "The issued access token"
    value: ${{ steps.exchange.outputs.access_token }}
  expires_in:
    description: "Lifetime of the issued access token in seconds"
    value: ${{ steps.exchange.outputs.expires_in }}
  scope:
    description: "Scopes granted on the issued access token"
    value: ${{ steps.exchange.outputs.scope }}

runs:
  using: composite
  steps:
    - id: exchange
      uses: actions/github-script@v8
      # WLIF_* — workload identity federation inputs relayed to the exchange script.
      env:
        WLIF_ENDPOINT: ${{ inputs.endpoint }}
        WLIF_ORG: ${{ inputs.org }}
        WLIF_ID_TOKEN_AUDIENCE: ${{ inputs.id_token_audience }}
        WLIF_SCOPE: ${{ inputs.scope }}
        WLIF_AUDIENCE: ${{ inputs.audience }}
      with:
        script: |
          const endpoint = process.env.WLIF_ENDPOINT.replace(/\/+$/, '');
          const org = (process.env.WLIF_ORG ?? '').trim();
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(org)) {
            core.setFailed(`Invalid org input '${process.env.WLIF_ORG ?? ''}': expected the organization ID (a UUID) as shown in the Wayport admin UI of ${endpoint}`);
            return;
          }
          const idToken = await core.getIDToken(process.env.WLIF_ID_TOKEN_AUDIENCE || undefined);
          const body = new URLSearchParams({
            grant_type: 'urn:ietf:params:oauth:grant-type:token-exchange',
            subject_token: idToken,
            subject_token_type: 'urn:ietf:params:oauth:token-type:jwt',
            requested_token_type: 'urn:ietf:params:oauth:token-type:access_token',
          });
          if (process.env.WLIF_SCOPE) body.set('scope', process.env.WLIF_SCOPE);
          if (process.env.WLIF_AUDIENCE) body.set('audience', process.env.WLIF_AUDIENCE);

          const response = await fetch(`${endpoint}/orgs/${org}/token`, {
            method: 'POST',
            headers: {
              'Accept': 'application/json',
              'Content-Type': 'application/x-www-form-urlencoded'
            },
            body
          });
          const text = await response.text();
          let result;
          try {
            result = JSON.parse(text);
          } catch {
            result = {};
          }
          if (!response.ok || !result.access_token) {
            const reason = result.error ? `${result.error}: ${result.error_description ?? ''}` : text;
            core.setFailed(`${new Date().toISOString()} \x1b[1m\x1b[31m❌ Unable to obtain access token from ${endpoint}/orgs/${org}, error:\x1b[0m \x1b[1m${response.status} ${reason}\x1b[0m`);
            return;
          }

          core.setSecret(result.access_token);
          core.setOutput('access_token', result.access_token);
          core.setOutput('expires_in', result.expires_in);
          core.setOutput('scope', result.scope ?? '');
          core.info(`${new Date().toISOString()} \x1b[1m\x1b[32m✅ Workload identity token issued\x1b[0m (scope: ${result.scope || 'none'}, expires in ${result.expires_in}s)`);
